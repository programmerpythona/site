<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>subnet#57320</title>
</head>
<body>

    <h1>subnet#57320</h1>
    <hr>

    <a href="#home" onclick="showPage('home')">/home</a> | 
    <a href="#games" onclick="showPage('games')">/games</a> | 
    <a href="#rules" onclick="showPage('rules')">/rules</a> | 
    <a href="#blog" onclick="showPage('blog')">/blog</a>
    
    <hr>

    <div id="home" class="page">
        <h2>/home</h2>
        <p>Добро пожаловать в подсеть subnet#57320.</p>
    </div>

    <div id="games" class="page" style="display: none;">
        <h2>/games</h2>
        <p>Список игр и проектов в подсети.</p>
    </div>

    <div id="rules" class="page" style="display: none;">
        <h2>/rules</h2>
        <p>Правила использования подсети.</p>
    </div>

    <div id="blog" class="page" style="display: none;">
        <h2>/blog</h2>
        <p>Записи и логи.</p>
    </div>

    <script>
        function showPage(pageId) {
            var pages = document.getElementsByClassName('page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].style.display = 'none';
            }
            var target = document.getElementById(pageId);
            if (target) {
                target.style.display = 'block';
            }
        }

        window.onload = function() {
            var hash = window.location.hash.replace('#', '');
            if (hash) {
                showPage(hash);
            } else {
                showPage('home');
            }
        };
    </script>

</body>
</html>
